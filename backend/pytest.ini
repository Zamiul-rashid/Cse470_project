[pytest]
# asyncio_mode=auto so every `async def test_` and async fixture runs without a
# decorator -- the whole backend is async, and an opt-in marker on 150 tests is
# 150 chances to forget one and have it silently pass without ever awaiting.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

testpaths = tests

# `pytest` is expected to run from backend/, and this is what makes `import app`
# work there without the README's `export PYTHONPATH` step.
pythonpath = .
